site_name: Deep Learning Handbook
site_url: https://minwoo02.github.io/deep-learning-handbook/
repo_url: https://github.com/minwoo02/deep-learning-handbook
theme:
  language: ko
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - content.code.copy
  palette:
  - scheme: default
    primary: indigo
    accent: teal
    toggle:
      icon: material/brightness-4
      name: 다크 모드
  - scheme: slate
    primary: indigo
    accent: teal
    toggle:
      icon: material/brightness-7
      name: 라이트 모드
nav:
- Home: index.md
- Learning Roadmap: roadmap.md
